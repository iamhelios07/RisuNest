name: Release build
run-name: ${{ inputs.publish && 'Release' || 'Rehearsal' }} ${{ inputs.tag || inputs.product }} (${{ inputs.source_ref || github.ref_name }})

on:
  workflow_call:
    inputs:
      product: { type: string, required: true }
      tag: { type: string, required: false }
      source_ref: { type: string, required: true }
      publish: { type: boolean, required: true }
      bootstrap: { type: boolean, default: false }
    secrets:
      TAURI_PRIVATE_KEY: { required: true }
      TAURI_KEY_PASSWORD: { required: false }
      RISUNEST_UPDATE_PUBLIC_KEY: { required: true }
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_KEYSTORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }
      RISUNEST_DEFAULT_REGISTRY_URL: { required: false }
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [app, sync]
        required: true
      tag:
        description: Product tag; leave empty to rehearse the source version, required for publication
        type: string
        required: false
      source_ref:
        description: Git ref to build
        type: string
        default: main
      publish:
        description: Publish a stable production release
        type: boolean
        default: false
      bootstrap:
        description: Explicit first-product catalog bootstrap
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && format('risunest-release-{0}', inputs.tag) || format('risunest-rehearsal-{0}', inputs.product) }}
  queue: max
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  RUST_VERSION: "1.97.1"
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  VITE_RISU_LEGAL_CONFIGURED: "TRUE"
  RISUNEST_UPDATE_PUBLIC_KEY: ${{ secrets.RISUNEST_UPDATE_PUBLIC_KEY }}

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      product: ${{ inputs.product }}
      tag: ${{ steps.identity.outputs.tag }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      publish: ${{ inputs.publish }}
      bootstrap: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a source commit contained in main
        shell: bash
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: identity
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync, readFileSync } = require("node:fs");
          const { join } = require("node:path");
          const { PRODUCT: product, TAG: requestedTag, PUBLISH: mode } = process.env;
          if (!["app", "sync"].includes(product)) throw new Error("invalid-release-product");
          if (!["true", "false"].includes(mode)) throw new Error("invalid-publication-mode");
          const publish = mode === "true";
          if (publish && !requestedTag) throw new Error("publication-tag-required");
          const versionFile = join(process.cwd(), product === "app" ? "version.json" : "server/version.json");
          const version = JSON.parse(readFileSync(versionFile, "utf8")).version;
          if (typeof version !== "string" || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error("Source version must be an unprefixed stable SemVer.");
          }
          const tag = requestedTag || `${product}-v${version}`;
          if (!tag.startsWith(`${product}-v`)) throw new Error(`Tag ${tag} does not belong to ${product}.`);
          if (tag !== `${product}-v${version}`) throw new Error(`Expected tag ${product}-v${version}, received ${tag}.`);
          const git = args => execFileSync("git", args, { cwd: process.cwd(), encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }).trim();
          const sourceCommit = git(["rev-parse", "HEAD"]);
          if (!/^[a-f0-9]{40}$/.test(sourceCommit)) throw new Error("invalid-source-commit");
          git(["merge-base", "--is-ancestor", sourceCommit, "refs/remotes/origin/main"]);
          const { GITHUB_EVENT_NAME: eventName, GITHUB_REF_TYPE: refType, GITHUB_REF_NAME: refName } = process.env;
          if (eventName === "push" && (refType !== "tag" || tag !== refName)) {
            throw new Error("pushed-release-tag-mismatch");
          }
          if (publish || eventName === "push") {
            const tagged = git(["rev-parse", "--verify", `refs/tags/${tag}^{commit}`]);
            if (tagged !== sourceCommit) throw new Error("release-tag-commit-mismatch");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nsource_commit=${sourceCommit}\n`);
          console.log(JSON.stringify({ tag, sourceCommit }));
          NODE
        env:
          PRODUCT: ${{ inputs.product }}
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
      - name: Validate source release inputs
        shell: bash
        run: |
          set -euo pipefail
          published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          args=(--product "$PRODUCT" --tag "$TAG" --source-commit "$SOURCE_COMMIT" --published-at "$published_at" --output release-input.json)
          if test "$PRODUCT" = sync; then args+=(--registry-url "$RISUNEST_DEFAULT_REGISTRY_URL"); fi
          node scripts/release/source-check.mjs "${args[@]}"
        env:
          PRODUCT: ${{ inputs.product }}
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          RISUNEST_DEFAULT_REGISTRY_URL: ${{ secrets.RISUNEST_DEFAULT_REGISTRY_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-input
          path: release-input.json
          if-no-files-found: error
          retention-days: 2

  release-tooling-tests:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with: { components: rustfmt }
      - name: Check Sync formatting
        if: inputs.product == 'sync'
        run: |
          cargo fmt --manifest-path server/sync/Cargo.toml --check
          cargo fmt --manifest-path server/manager/Cargo.toml --check
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: inputs.product == 'app'
        with: { distribution: temurin, java-version: "21" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server/manager/gui --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir server/endpoint-registry --ignore-workspace install --frozen-lockfile
      - run: pnpm check:test-inventory
      - uses: ./.github/actions/test-references
      - run: pnpm test:node
      - run: pnpm test:protocol
      - name: Preflight app signing inputs
        if: inputs.product == 'app'
        run: node scripts/release/signing-preflight.mjs --product "${{ inputs.product }}"
        env:
          SIGNING_PREFLIGHT_ROOT: ${{ runner.temp }}/risunest-signing-preflight
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RISUNEST_UPDATE_PUBLIC_KEY: ${{ secrets.RISUNEST_UPDATE_PUBLIC_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Preflight Sync signing inputs
        if: inputs.product == 'sync'
        run: node scripts/release/signing-preflight.mjs --product "${{ inputs.product }}"
        env:
          SIGNING_PREFLIGHT_ROOT: ${{ runner.temp }}/risunest-signing-preflight
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RISUNEST_UPDATE_PUBLIC_KEY: ${{ secrets.RISUNEST_UPDATE_PUBLIC_KEY }}
          RISUNEST_DEFAULT_REGISTRY_URL: ${{ secrets.RISUNEST_DEFAULT_REGISTRY_URL }}
      - name: Clean signing preflight files
        if: always()
        run: >-
          node -e "require('node:fs').rmSync(process.env.SIGNING_PREFLIGHT_ROOT, { recursive: true, force: true })"
        env:
          SIGNING_PREFLIGHT_ROOT: ${{ runner.temp }}/risunest-signing-preflight

  app-web-tests:
    if: inputs.product == 'app'
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: release-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: release-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:tests
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser:agent
      - run: pnpm check:plugin-dts
      - run: pnpm check:production-bundle

  app-android-tests:
    if: inputs.product == 'app'
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        timeout-minutes: 15
        run: bash scripts/retry-command.sh sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with: { targets: aarch64-linux-android,x86_64-linux-android }
      - run: pnpm install --frozen-lockfile
      - name: Verify the committed Android shell
        shell: bash
        run: |
          set -euo pipefail
          required=(
            src-tauri/gen/android/settings.gradle
            src-tauri/gen/android/app/build.gradle.kts
            src-tauri/gen/android/buildSrc/src/main/java/io/github/rsyumi/risunest/kotlin/BuildTask.kt
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar
            src-tauri/gen/android/app/src/main/java/io/github/rsyumi/risunest/MainActivity.kt
          )
          for path in "${required[@]}"; do test -f "$path"; done
          git diff --exit-code -- src-tauri/gen/android
      - name: Prepare Gradle distribution
        timeout-minutes: 10
        run: bash scripts/retry-command.sh bash src-tauri/gen/android/gradlew --version
      - name: Generate Android build files through a real agent build
        shell: bash
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm exec -- tauri android build --debug --apk --target aarch64 --ci --config src-tauri/tauri.agent.conf.json -- --locked
          git diff --exit-code -- src-tauri/gen/android
      - run: chmod +x src-tauri/gen/android/gradlew
      - working-directory: src-tauri/gen/android
        run: ./gradlew :app:testArmDebugUnitTest :app:testLowMemorySafCopy :tauri-plugin-barcode-scanner:testDebugUnitTest --no-daemon

  app-ios-tests:
    if: inputs.product == 'app'
    needs: source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with: { targets: aarch64-apple-ios-sim }
      - name: Select the verified iOS toolchain
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          printf '%s\n' "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - name: Run Rust test inventory in an iOS simulator
        shell: bash
        run: bash scripts/ios-native-tests.sh
      - run: pnpm ios:build:simulator:agent

  sync-gui-tests:
    if: inputs.product == 'sync'
    needs: source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install native GUI test dependencies
        timeout-minutes: 15
        run: sudo apt-get -o Acquire::Retries=2 --error-on=any update && sudo apt-get -o Acquire::Retries=2 install -y pkg-config libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm --dir server/manager/gui --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir server/manager/gui --ignore-workspace check
      - run: pnpm --dir server/manager/gui --ignore-workspace test
      - run: cargo test --manifest-path server/manager/gui/src-tauri/Cargo.toml --release --locked

  endpoint-registry-tests:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - run: pnpm --dir server/endpoint-registry --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir server/endpoint-registry --ignore-workspace check
      - run: pnpm --dir server/endpoint-registry --ignore-workspace test

  shared-wasm-tests:
    needs: source
    runs-on: ubuntu-24.04
    env:
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with: { targets: wasm32-unknown-unknown }
      - name: Install native and WASM build dependencies
        timeout-minutes: 15
        run: sudo apt-get -o Acquire::Retries=2 --error-on=any update && sudo apt-get -o Acquire::Retries=2 install -y clang llvm pkg-config libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev gnome-keyring dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Install the locked WASM binding generator
        shell: pwsh
        run: |
          $lock = Get-Content -Raw crates/external-storage-wasm/Cargo.lock
          $version = [regex]::Match($lock, 'name = "wasm-bindgen"\r?\nversion = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing wasm-bindgen lockfile version' }
          cargo install wasm-bindgen-cli --version $version --locked
          if ($LASTEXITCODE -ne 0) { throw 'wasm-bindgen installation failed' }
      - run: pnpm test:wasm
      - name: Recheck native artifacts after the standalone WASM build
        run: dbus-run-session -- bash scripts/linux-native-tests.sh --lib external_storage -- --test-threads=1

  prepare-draft:
    if: >-
      always() && needs.source.result == 'success' && needs.release-tooling-tests.result == 'success' && needs.endpoint-registry-tests.result == 'success' && needs.shared-wasm-tests.result == 'success' &&
      ((inputs.product == 'app' && needs.app-web-tests.result == 'success') ||
       (inputs.product == 'sync' && needs.sync-gui-tests.result == 'success'))
    needs: [source, release-tooling-tests, endpoint-registry-tests, shared-wasm-tests, app-web-tests, sync-gui-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      already_published: ${{ steps.mode.outputs.already_published || steps.draft.outputs.already_published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-input }
      - id: mode
        if: inputs.publish != true
        run: echo "already_published=false" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: inputs.publish == true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.publish == true
        with: { node-version: "24", package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
        if: inputs.publish == true
      - id: draft
        if: inputs.publish == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/publish.mjs --prepare-draft
          --tag "${{ needs.source.outputs.tag }}"
          --source-commit "${{ needs.source.outputs.source_commit }}"
          --release-input release-input.json

  app-desktop:
    name: app-desktop (${{ matrix.os == 'darwin' && 'macos' || matrix.os }} ${{ matrix.arch }})
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.prepare-draft.result == 'success' &&
      inputs.product == 'app'
    needs: [source, prepare-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, os: windows, arch: x86_64, bundles: nsis, executable: RisuNest.exe }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows, arch: aarch64, bundles: nsis, executable: RisuNest.exe }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, os: linux, arch: x86_64, bundles: "deb,appimage", executable: RisuNest }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os: linux, arch: aarch64, bundles: "deb,appimage", executable: RisuNest }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, os: darwin, arch: x86_64, bundles: "app,dmg", executable: RisuNest }
          - { runner: macos-15, target: aarch64-apple-darwin, os: darwin, arch: aarch64, bundles: "app,dmg", executable: RisuNest }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-input }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with: { targets: "${{ matrix.target }}" }
      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: sudo apt-get -o Acquire::Retries=2 --error-on=any update && sudo apt-get -o Acquire::Retries=2 install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils shared-mime-info xdg-utils libfuse2t64 gnome-keyring dbus-x11 xvfb
      - run: pnpm install --frozen-lockfile
      - name: Use a temporary directory without symlinked ancestors
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          echo "TMPDIR=$(cd "$RUNNER_TEMP/tests" && pwd -P)" >> "$GITHUB_ENV"
      - name: Use runner temporary storage for Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeTestTemp = Join-Path $env:RUNNER_TEMP 'native-tests'
          New-Item -ItemType Directory -Force -Path $nativeTestTemp | Out-Null
          "TEMP=$nativeTestTemp" >> $env:GITHUB_ENV
          "TMP=$nativeTestTemp" >> $env:GITHUB_ENV
      - if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/linux-native-tests.sh --release --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Run Windows native tests with isolated storage stress cases
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          isolated=(
            external_storage::packaging::tests::c_a_spool_with_room_for_two_objects_still_finishes_the_publication
            external_storage::packaging::tests::c_a_no_op_publication_whose_every_run_exceeds_the_bound_writes_nothing
            external_storage::packaging::tests::c_required_edits_beyond_the_bound_are_all_published_beside_a_bounded_cycle
          )
          skips=()
          for test in "${isolated[@]}"; do skips+=(--skip "$test"); done
          cargo test --manifest-path src-tauri/Cargo.toml --release --locked --target '${{ matrix.target }}' -- "${skips[@]}"
          cargo test --manifest-path src-tauri/Cargo.toml --release --locked --target '${{ matrix.target }}' --lib -- --exact "${isolated[@]}" --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/native-storage-tests.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/native-storage-tests.log"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --package tauri-plugin-updater --release --locked --target ${{ matrix.target }} --lib
      - if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/linux-native-tests.sh --package tauri-plugin-window-state --release --target ${{ matrix.target }} --lib
      - if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --package tauri-plugin-window-state --release --locked --target ${{ matrix.target }} --lib
      - if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test --manifest-path crates/wry/Cargo.toml --package wry --release --locked --target ${{ matrix.target }} --lib
      - if: runner.os != 'Linux'
        run: cargo test --manifest-path crates/wry/Cargo.toml --package wry --release --locked --target ${{ matrix.target }} --lib
      - name: Windows and macOS persistence boundary
        if: matrix.runner == 'windows-2022' || matrix.runner == 'macos-15'
        run: pnpm desktop:test-boundary:agent
      - name: Linux persistence boundary
        if: matrix.runner == 'ubuntu-24.04'
        run: xvfb-run -a dbus-run-session -- bash scripts/linux-native-tests.sh --boundary

      - name: Compile app desktop binary without signing key
        if: needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          mkdir -p release-work
          node scripts/release/tauri-config.mjs --release-input release-input.json --output "$RUNNER_TEMP/release-tauri.json"
          pnpm exec -- tauri build --target "$TARGET" --no-bundle --config "$RUNNER_TEMP/release-tauri.json" -- --locked
          cp "$CARGO_TARGET_DIR/$TARGET/release/$EXECUTABLE" release-work/app-binary
      - name: Bundle app desktop assets
        if: needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          pnpm exec -- tauri bundle --target "$TARGET" --bundles "$BUNDLES" --config "$RUNNER_TEMP/release-tauri.json"
      - name: Verify app and Sync uninstall cleanup, retry and progress
        if: matrix.os == 'windows' && needs.prepare-draft.outputs.already_published != 'true'
        env:
          RISUNEST_REQUIRE_NSIS: "1"
        run: node --test tests/release/app-nsis-uninstall.node-test.mjs tests/release/sync-nsis-uninstall.node-test.mjs tests/release/nsis-progress.node-test.mjs
      - name: Package app desktop assets
        if: needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node scripts/release/package-app.mjs --kind desktop --os "$OS" --arch "$ARCH" --bundle-dir "$CARGO_TARGET_DIR/$TARGET/release/bundle" --binary release-work/app-binary --release-input release-input.json --output release-work/packages
      - name: Sign final app desktop assets
        if: needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          node scripts/release/build.mjs --release-input release-input.json --leg "desktop_${OS}_${ARCH}" --assets-json release-work/packages/assets.json --output release-out --public-key "$RISUNEST_UPDATE_PUBLIC_KEY"
      - name: Verify the produced macOS archive with the production updater
        if: matrix.os == 'darwin' && needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export RISUNEST_MAC_UPDATE_ARCHIVE="$CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle/macos/RisuNest.app.tar.gz"
          cargo test --manifest-path src-tauri/Cargo.toml --package tauri-plugin-updater --target '${{ matrix.target }}' --release --locked --lib updater::tests::produced_macos_archive_replaces_disposable_app_and_preserves_sibling_data -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/app-update-install.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/app-update-install.log"
      - name: Upload final assets to draft
        if: inputs.publish == true && needs.prepare-draft.outputs.already_published != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/upload-build.mjs
          --draft-id "${{ needs.prepare-draft.outputs.release_id }}"
          --directory release-out
          --inventory "release-out/inventory-desktop_${{ matrix.os }}_${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.prepare-draft.outputs.already_published != 'true'
        with:
          name: ${{ inputs.publish && format('inventory-app-desktop-{0}-{1}', matrix.os, matrix.arch) || format('rehearsal-app-desktop-{0}-{1}', matrix.os, matrix.arch) }}
          path: ${{ inputs.publish && format('release-out/inventory-desktop_{0}_{1}.json', matrix.os, matrix.arch) || 'release-out/*' }}
          if-no-files-found: error
          retention-days: 2

  app-android:
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.prepare-draft.result == 'success' && needs.app-android-tests.result == 'success' &&
      inputs.product == 'app' && needs.prepare-draft.outputs.already_published != 'true'
    needs: [source, prepare-draft, app-android-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-input }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with: { targets: aarch64-linux-android }
      - name: Install Android SDK packages
        timeout-minutes: 15
        run: bash scripts/retry-command.sh sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: pnpm install --frozen-lockfile
      - name: Verify the committed Android shell
        shell: bash
        run: |
          set -euo pipefail
          required=(
            src-tauri/gen/android/settings.gradle
            src-tauri/gen/android/app/build.gradle.kts
            src-tauri/gen/android/buildSrc/src/main/java/io/github/rsyumi/risunest/kotlin/BuildTask.kt
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar
            src-tauri/gen/android/app/src/main/java/io/github/rsyumi/risunest/MainActivity.kt
          )
          for path in "${required[@]}"; do test -f "$path"; done
          git diff --exit-code -- src-tauri/gen/android
      - name: Prepare Gradle distribution
        timeout-minutes: 10
        run: bash scripts/retry-command.sh bash src-tauri/gen/android/gradlew --version
      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          node scripts/release/android-signing.mjs
          --keystore "$RUNNER_TEMP/risunest-release.jks"
          --properties src-tauri/gen/android/keystore.properties
      - name: Build and package signed ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-work
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          node scripts/release/tauri-config.mjs --release-input release-input.json --output "$RUNNER_TEMP/release-tauri.json"
          pnpm exec -- tauri android build --apk --target aarch64 --ci --config "$RUNNER_TEMP/release-tauri.json" -- --locked
          git diff --exit-code -- src-tauri/gen/android
          apk_count=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | wc -l | tr -d ' ')
          test "$apk_count" -eq 1
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          node scripts/release/package-app.mjs --kind android --arch aarch64 --package "$apk" --binary "$CARGO_TARGET_DIR/aarch64-linux-android/release/librisunest_lib.so" --release-input release-input.json --output release-work/packages
      - name: Sign final ARM64 APK
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          node scripts/release/build.mjs --release-input release-input.json --leg mobile_android_aarch64 --assets-json release-work/packages/assets.json --output release-out --public-key "$RISUNEST_UPDATE_PUBLIC_KEY"
      - name: Remove runner signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/risunest-release.jks" src-tauri/gen/android/keystore.properties
      - name: Upload final assets to draft
        if: inputs.publish == true
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/release/upload-build.mjs --draft-id "${{ needs.prepare-draft.outputs.release_id }}" --directory release-out --inventory release-out/inventory-mobile_android_aarch64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.publish && 'inventory-app-android-aarch64' || 'rehearsal-app-android-aarch64' }}
          path: ${{ inputs.publish && 'release-out/inventory-mobile_android_aarch64.json' || 'release-out/*' }}
          if-no-files-found: error
          retention-days: 2

  app-ios:
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.prepare-draft.result == 'success' && needs.app-ios-tests.result == 'success' &&
      inputs.product == 'app' && needs.prepare-draft.outputs.already_published != 'true'
    needs: [source, prepare-draft, app-ios-tests]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-input }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with: { targets: aarch64-apple-ios }
      - name: Select the verified iPhoneOS toolchain
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          printf '%s\n' "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - name: Build and package unsigned iPhoneOS ARM64 IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-work
          node scripts/release/tauri-config.mjs --release-input release-input.json --output "$RUNNER_TEMP/release-tauri.json"
          pnpm exec -- tauri ios build --ci --target aarch64 --no-sign --config "$RUNNER_TEMP/release-tauri.json" -- --locked
          ipa_count=$(find src-tauri/gen/apple -type f -name '*.ipa' | wc -l | tr -d ' ')
          test "$ipa_count" -eq 1
          ipa=$(find src-tauri/gen/apple -type f -name '*.ipa' -print -quit)
          node scripts/release/package-app.mjs --kind ios --arch aarch64 --package "$ipa" --release-input release-input.json --output release-work/packages
      - name: Sign final iPhoneOS ARM64 IPA
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          node scripts/release/build.mjs --release-input release-input.json --leg mobile_ios_aarch64 --assets-json release-work/packages/assets.json --output release-out --public-key "$RISUNEST_UPDATE_PUBLIC_KEY"
      - name: Upload final assets to draft
        if: inputs.publish == true
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/release/upload-build.mjs --draft-id "${{ needs.prepare-draft.outputs.release_id }}" --directory release-out --inventory release-out/inventory-mobile_ios_aarch64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.publish && 'inventory-app-ios-aarch64' || 'rehearsal-app-ios-aarch64' }}
          path: ${{ inputs.publish && 'release-out/inventory-mobile_ios_aarch64.json' || 'release-out/*' }}
          if-no-files-found: error
          retention-days: 2

  sync-suite:
    name: sync-suite (${{ matrix.os == 'darwin' && 'macos' || matrix.os }} ${{ matrix.arch }})
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.prepare-draft.result == 'success' &&
      inputs.product == 'sync'
    needs: [source, prepare-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, os: windows, arch: x86_64, suffix: .exe }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows, arch: aarch64, suffix: .exe }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, os: linux, arch: x86_64, suffix: "" }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, os: linux, arch: aarch64, suffix: "" }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, os: darwin, arch: x86_64, suffix: "" }
          - { runner: macos-15, target: aarch64-apple-darwin, os: darwin, arch: aarch64, suffix: "" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RISUNEST_DEFAULT_REGISTRY_URL: ${{ secrets.RISUNEST_DEFAULT_REGISTRY_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-input }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - run: pnpm install --frozen-lockfile
      - name: Use a temporary directory without symlinked ancestors
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          echo "TMPDIR=$(cd "$RUNNER_TEMP/tests" && pwd -P)" >> "$GITHUB_ENV"
      - name: Use runner temporary storage for Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeTestTemp = Join-Path $env:RUNNER_TEMP 'native-tests'
          New-Item -ItemType Directory -Force -Path $nativeTestTemp | Out-Null
          "TEMP=$nativeTestTemp" >> $env:GITHUB_ENV
          "TMP=$nativeTestTemp" >> $env:GITHUB_ENV
      - run: cargo clippy --manifest-path server/sync/Cargo.toml --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --manifest-path crates/sync-wire/Cargo.toml --release --locked --target ${{ matrix.target }}
      - run: cargo test --manifest-path server/sync/Cargo.toml --release --locked --target ${{ matrix.target }}
      - run: cargo test --manifest-path server/manager/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Run synthetic Linux installer success and rollback checks
        if: runner.os == 'Linux'
        run: bash server/manager/install/install.test.sh
      - name: Build native process harness executables
        shell: bash
        run: |
          cargo build --manifest-path server/sync/Cargo.toml --release --locked --target ${{ matrix.target }}
          cargo build --manifest-path server/manager/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Run isolated daemon and manager process lifecycle
        shell: bash
        run: >-
          node server/manager/tests/daemon-process.mjs
          "$CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-server${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-manager${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Run Windows Task Scheduler lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./server/manager/tests/windows-startup.ps1
          -Manager "$env:CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-manager.exe"
          -Server "$env:CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-server.exe"
      - name: Run Windows scheduled update success and recovery lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RISUNEST_TEST_SERVER: ${{ format('{0}/{1}/release/risunest-sync-server.exe', env.CARGO_TARGET_DIR, matrix.target) }}
          RISUNEST_TEST_MANAGER: ${{ format('{0}/{1}/release/risunest-sync-manager.exe', env.CARGO_TARGET_DIR, matrix.target) }}
        run: |
          $tests = @(
            'update_helper/no_claim_helper_task_is_removed_without_consuming_recovery_state',
            'update_helper/helper_replaces_and_restarts_an_isolated_live_server',
            'update_helper/helper_verifies_a_stopped_replacement_then_restores_stopped_intent',
            'update_helper/interrupted_files_recovery_outlives_the_active_installed_manager',
            'update_helper/helper_recovers_the_live_server_when_its_parent_does_not_exit',
            'update_helper/helper_rolls_back_a_corrupt_live_replacement_and_restarts_the_old_server',
            'update_helper/installer_guard_records_restart_failure_after_accepted_corrupt_server_start',
            'manual_start/manual_start_is_independent_of_login_and_survives_registration_changes'
          )
          $logDirectory = Join-Path $env:RUNNER_TEMP 'sync-update-tests'
          New-Item -ItemType Directory -Force -Path $logDirectory | Out-Null
          foreach ($entry in $tests) {
            $target, $test = $entry -split '/', 2
            & cargo test --manifest-path server/manager/Cargo.toml --release --locked --target '${{ matrix.target }}' --test $target $test -- --ignored --exact --nocapture 2>&1 |
              Tee-Object -FilePath (Join-Path $logDirectory "$test.log") -OutVariable output | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "$test failed." }
            if (($output | Out-String) -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') {
              throw "$test did not execute exactly one passing test."
            }
          }
      - name: Preserve Windows scheduled update test logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-update-tests-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-update-tests/*.log
          retention-days: 3
      - name: Run Linux systemd, TUI and installer lifecycle
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          test "$(loginctl show-user "$USER" -p Linger --value)" = yes
          systemctl --user daemon-reload
          python3 server/manager/tests/linux-process.py \
            "$CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-server" \
            "$CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-manager"
      - name: Run macOS LaunchAgent and updater schedule lifecycle
        if: runner.os == 'macOS'
        run: >-
          sh server/manager/tests/macos-startup.sh
          "$CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-server"
          "$CARGO_TARGET_DIR/${{ matrix.target }}/release/risunest-sync-manager"

      - name: Install Sync GUI dependencies
        if: matrix.os != 'linux' && needs.prepare-draft.outputs.already_published != 'true'
        run: pnpm --dir server/manager/gui --ignore-workspace install --frozen-lockfile
      - name: Fetch and verify pinned cloudflared
        timeout-minutes: 30
        if: needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/vendor.mjs --target "$OS-$ARCH" --output vendor
          node -e "const fs=require('node:fs'),v=require('./vendor/vendor.json'); fs.appendFileSync(process.env.GITHUB_ENV, 'RISUNEST_CLOUDFLARED_INPUT='+require('node:path').resolve('vendor/vendor.json')+'\nRISUNEST_CLOUDFLARED='+v.executable+'\nRISUNEST_CLOUDFLARED_LICENSE='+v.license+'\n')"
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
      - name: Prove Windows cloudflared start, tunnel, stop and restart
        if: matrix.os == 'windows' && needs.prepare-draft.outputs.already_published != 'true'
        run: node scripts/release/verify-cloudflared.mjs --binary "$env:RISUNEST_CLOUDFLARED"
      - name: Build and package Sync distributions
        if: needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          RISUNEST_UPDATE_PUBLIC_KEY: ${{ secrets.RISUNEST_UPDATE_PUBLIC_KEY }}
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "$RISUNEST_UPDATE_PUBLIC_KEY"
          mkdir -p release-work/native release-work/raw release-work/packages release-out
          version=$(node -p "require('./release-input.json').version")
          node server/manager/install/build.mjs --target "$TARGET" --output release-work/native --registry-url "$RISUNEST_DEFAULT_REGISTRY_URL" --version "$version"
          daemon=$(node -p "require('./release-work/native/native-build.json').daemon")
          python server/sync/distribution/package.py --binary "$daemon" --target "$TARGET" --version "$version" --output release-work/raw
          raw_count=$(find release-work/raw -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')
          test "$raw_count" -eq 1
          raw=$(find release-work/raw -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)
          vendor_sha=$(node -p "require('./vendor/vendor.json').executableSha256")
          node server/manager/install/package.mjs --native-build release-work/native/native-build.json --raw-archive "$raw" --release-input release-input.json --output release-work/packages --cloudflared-sha256 "$vendor_sha"
      - name: Sign final Sync distributions
        if: needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          RISUNEST_UPDATE_PUBLIC_KEY: ${{ secrets.RISUNEST_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node scripts/release/build.mjs --release-input release-input.json --leg "sync_${OS}_${ARCH}" --assets-json release-work/packages/assets.json --output release-out --public-key "$RISUNEST_UPDATE_PUBLIC_KEY"
      - name: Install, reinstall and roll back the produced Linux managed package
        if: matrix.os == 'linux' && needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          test "$(loginctl show-user "$USER" --property=Linger --value)" = yes
          systemctl --user daemon-reload
          managed=$(node -e "const path=require('node:path'); const matches=require('./release-work/packages/assets.json').filter((asset) => asset.download.variant === 'managed' && asset.download.os === 'linux' && asset.download.arch === process.argv[1] && asset.download.format === 'tar.gz'); if (matches.length !== 1) throw new Error('Expected one managed Linux archive.'); process.stdout.write(path.resolve(matches[0].path));" "${{ matrix.arch }}")
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME bash server/manager/install/managed-install.integration.test.sh "$managed"
      - name: Fetch and verify the previous published Windows Sync bundle
        if: matrix.os == 'windows' && needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { compareVersions, parseTag } from "./scripts/release/contracts.mjs";
          import { assetName, readJson } from "./scripts/release/common.mjs";
          import { GitHubReleases } from "./scripts/release/github.mjs";
          import { verifyFileSignature } from "./scripts/release/signatures.mjs";
          // The upgrade and removal checks start from the newest Sync release published before this one.
          const github = new GitHubReleases(process.env.GH_TOKEN);
          const current = readJson("release-input.json").version;
          const previous = (await github.listPublishedStable())
            .filter(release => /^sync-v\d+\.\d+\.\d+$/.test(release.tag_name))
            .map(release => ({ release, version: parseTag(release.tag_name).version }))
            .filter(({ version }) => compareVersions(version, current) < 0)
            .sort((a, b) => compareVersions(b.version, a.version))[0];
          if (!previous) {
            console.log("No Sync release was published before this one; released-bundle checks are skipped.");
          } else {
            const name = assetName({ product: "sync", variant: "managed", os: "windows", arch: process.env.ARCH, format: "zip", version: previous.version });
            const directory = join(process.env.RUNNER_TEMP, "released-sync");
            mkdirSync(directory, { recursive: true });
            const bundle = join(directory, name);
            writeFileSync(bundle, await github.downloadAsset(previous.release, name, 256 * 1024 * 1024));
            const signature = (await github.downloadAsset(previous.release, `${name}.sig`, 64 * 1024)).toString("utf8");
            await verifyFileSignature(bundle, signature, process.env.RISUNEST_UPDATE_PUBLIC_KEY);
            appendFileSync(process.env.GITHUB_ENV, `RISUNEST_RELEASED_SYNC_BUNDLE=${bundle}\n`);
            console.log(`Verified ${name} from ${previous.release.tag_name}.`);
          }
          EOF
      - name: Run synthetic Windows NSIS install failure and rollback checks
        if: matrix.os == 'windows' && needs.prepare-draft.outputs.already_published != 'true'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $arguments = @()
          if ($env:RISUNEST_RELEASED_SYNC_BUNDLE) {
            $built = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET/release"
            $arguments = @(
              '-ReleasedBundle', $env:RISUNEST_RELEASED_SYNC_BUNDLE,
              '-ManagerBinary', (Join-Path $built 'risunest-sync-manager.exe'),
              '-BackgroundBinary', (Join-Path $built 'risunest-sync-manager-background.exe')
            )
          }
          pwsh -NoProfile -File server/manager/install/windows.test.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "windows.test.ps1 exited with $LASTEXITCODE." }
      - name: Apply and roll back the produced macOS Sync app
        if: matrix.os == 'darwin' && needs.prepare-draft.outputs.already_published != 'true'
        shell: bash
        env:
          RISUNEST_TEST_RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          inventory="$(pwd)/release-out/inventory-sync_darwin_${{ matrix.arch }}.json"
          managed="$(node -e "const path=require('node:path'); const i=require(process.argv[1]); const d=i.downloads.filter(x=>x.variant==='managed'&&x.format==='app.tar.gz'); if(d.length!==1)throw new Error('Expected one managed app archive'); console.log(path.join(path.dirname(process.argv[1]),d[0].fileName));" "$inventory")"
          sh server/manager/tests/macos-update.sh "$managed" "$managed.sig" "$inventory" 2>&1 | tee "$RUNNER_TEMP/macos-update.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/macos-update.log"
      - name: Upload final assets to draft
        if: inputs.publish == true && needs.prepare-draft.outputs.already_published != 'true'
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: >-
          node scripts/release/upload-build.mjs
          --draft-id "${{ needs.prepare-draft.outputs.release_id }}"
          --directory release-out
          --inventory "release-out/inventory-sync_${{ matrix.os }}_${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.prepare-draft.outputs.already_published != 'true'
        with:
          name: ${{ inputs.publish && format('inventory-sync-{0}-{1}', matrix.os, matrix.arch) || format('rehearsal-sync-{0}-{1}', matrix.os, matrix.arch) }}
          path: ${{ inputs.publish && format('release-out/inventory-sync_{0}_{1}.json', matrix.os, matrix.arch) || 'release-out/*' }}
          if-no-files-found: error
          retention-days: 2

  collect-publish:
    if: >-
      always() && needs.prepare-draft.result == 'success' && needs.prepare-draft.outputs.already_published != 'true' &&
      needs.source.result == 'success' && needs.release-tooling-tests.result == 'success' && needs.endpoint-registry-tests.result == 'success' && needs.shared-wasm-tests.result == 'success' &&
      ((inputs.product == 'app' && needs.app-web-tests.result == 'success' && needs.app-desktop.result == 'success' && needs.app-android-tests.result == 'success' && needs.app-ios-tests.result == 'success' && needs.app-android.result == 'success' && needs.app-ios.result == 'success') ||
       (inputs.product == 'sync' && needs.sync-gui-tests.result == 'success' && needs.sync-suite.result == 'success'))
    needs: [source, release-tooling-tests, endpoint-registry-tests, shared-wasm-tests, prepare-draft, app-web-tests, app-desktop, app-android-tests, app-ios-tests, app-android, app-ios, sync-gui-tests, sync-suite]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: risunest-stable-publish
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-input }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        if: inputs.product == 'sync'
      - run: pnpm install --frozen-lockfile
      - name: Download build inventories
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.publish && format('inventory-{0}-*', inputs.product) || format('rehearsal-{0}-*', inputs.product) }}
          path: collected
          merge-multiple: false
      - name: Download draft release assets
        if: inputs.publish == true
        timeout-minutes: 30
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/retry-command.sh gh release download "${{ needs.source.outputs.tag }}" --dir collected/assets --clobber
      - name: Collect and validate every required artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/collect.mjs --product "$PRODUCT" --tag "$TAG" --source-commit "$SOURCE_COMMIT" --release-input release-input.json --input-dir collected --output-dir release-manifest --public-key "$RISUNEST_UPDATE_PUBLIC_KEY"
        env:
          PRODUCT: ${{ needs.source.outputs.product }}
          TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.source_commit }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      - name: Prove all managed Sync packages with the production Rust extractor
        if: inputs.product == 'sync'
        run: >-
          node scripts/release/runtime-parity.mjs
          --product-manifest release-manifest/product-manifest.json
          --assets-dir collected
      - name: Publish verified stable release
        if: inputs.publish == true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCT: ${{ needs.source.outputs.product }}
          TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.source_commit }}
          DRAFT_ID: ${{ needs.prepare-draft.outputs.release_id }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--publish --product "$PRODUCT" --tag "$TAG" --source-commit "$SOURCE_COMMIT" --release-input release-input.json --product-manifest release-manifest/product-manifest.json --assets collected/assets --draft-id "$DRAFT_ID")
          if test "$BOOTSTRAP" = true; then args+=(--bootstrap); fi
          node scripts/release/publish.mjs "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.publish != true
        with:
          name: release-validation-${{ inputs.product }}
          path: |
            release-manifest/product-manifest.json
            release-manifest/product-manifest.json.sig
          if-no-files-found: error
          retention-days: 2

  recover-published:
    if: >-
      always() && inputs.publish == true && needs.prepare-draft.result == 'success' && needs.prepare-draft.outputs.already_published == 'true' &&
      needs.source.result == 'success' && needs.release-tooling-tests.result == 'success' && needs.endpoint-registry-tests.result == 'success' && needs.shared-wasm-tests.result == 'success' &&
      ((inputs.product == 'app' && needs.app-web-tests.result == 'success' && needs.app-desktop.result == 'success' && needs.app-android-tests.result == 'success' && needs.app-ios-tests.result == 'success') ||
       (inputs.product == 'sync' && needs.sync-gui-tests.result == 'success' && needs.sync-suite.result == 'success'))
    needs: [source, release-tooling-tests, endpoint-registry-tests, shared-wasm-tests, prepare-draft, app-web-tests, app-desktop, app-android-tests, app-ios-tests, sync-gui-tests, sync-suite]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: risunest-stable-publish
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - name: Download immutable published assets
        timeout-minutes: 10
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: >-
          bash scripts/retry-command.sh gh release download "${{ needs.source.outputs.tag }}" --dir published --clobber
          --pattern product-manifest.json --pattern product-manifest.json.sig
      - name: Recover latest only when this release still owns the newest catalog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/publish.mjs --publish
          --product "${{ needs.source.outputs.product }}"
          --tag "${{ needs.source.outputs.tag }}"
          --source-commit "${{ needs.source.outputs.source_commit }}"
          --product-manifest published/product-manifest.json
          --assets published
          --draft-id "${{ needs.prepare-draft.outputs.release_id }}"

  release-result:
    if: ${{ !cancelled() }}
    needs: [collect-publish, recover-published]
    runs-on: ubuntu-24.04
    steps:
      - name: Require completed artifact verification
        env:
          COLLECT_RESULT: ${{ needs.collect-publish.result }}
          RECOVERY_RESULT: ${{ needs.recover-published.result }}
        run: |
          node -e 'if (![process.env.COLLECT_RESULT, process.env.RECOVERY_RESULT].includes("success")) { console.error("Release artifacts were not verified."); process.exit(1); }'

  update-readme:
    if: ${{ !cancelled() && inputs.publish == true && needs.release-result.result == 'success' }}
    needs: [source, release-result]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: risunest-stable-publish
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.source.outputs.source_commit }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - name: Update README downloads from the published catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/readme.mjs
