name: Verified release download caches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - scripts/release/**
      - tests/release/**
      - .github/workflows/release-cache.yml

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release

  downloads:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Fetch lockfile-pinned package downloads
        shell: bash
        run: |
          set -euo pipefail
          pnpm fetch --frozen-lockfile
      - name: Enforce the download cache budget
        shell: bash
        run: >-
          node scripts/release/cache-budget.mjs --max-bytes 1300000000
          --path "${{ steps.pnpm-store.outputs.path }}"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: release-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
